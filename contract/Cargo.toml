[package]
name = "steady_pay"
version = "0.1.0"
edition = "2021"
description = "Steady Pay: turns lumpy freelance income into a fixed salary, with tax set aside on arrival."
license = "MIT"
repository = "https://github.com/Mathimaran1/steady-pay"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
